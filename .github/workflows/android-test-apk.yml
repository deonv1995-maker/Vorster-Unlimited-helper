name: Android Test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/android-test-apk.yml"
  push:
    branches:
      - main
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/android-test-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Paper parser regression tests
        run: npm run test:parser

      - name: Backup format regression tests
        run: npm run test:backup

      - name: Generate Android native project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vorster-unlimited-helper-android-test
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

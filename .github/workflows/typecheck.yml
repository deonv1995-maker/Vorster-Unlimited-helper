name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Paper parser regression tests
        run: npm run test:parser

      - name: Backup format regression tests
        run: npm run test:backup
